name: CI
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - name: Package extension
        run: cd dist && zip -r ../hanyu-pinyin-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: hanyu-pinyin-extension
          path: hanyu-pinyin-extension.zip
