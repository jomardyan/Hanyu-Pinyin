name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install GNU Make
        run: choco install make --yes --no-progress
      - name: Check PowerShell task discovery and locked dependency setup
        shell: pwsh
        run: |
          .\make.ps1 help
          .\make.ps1 setup
      - name: Validate through the PowerShell wrapper
        shell: pwsh
        run: .\make.ps1 check

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install fonts for store graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - run: npm ci

      - name: Validate and package Chrome Web Store release
        run: node make.mjs release

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-submission
          path: release/*
          if-no-files-found: error

  browser-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install Playwright Chromium
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Browser DOM regressions
        run: node make.mjs test-browser

      - name: Popup and settings UI regressions
        run: node make.mjs test-ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-suite-results
          path: |
            browser-test-results.json
            ui-test-results.json
            popup-ui-tested.png
            options-ui-tested.png
          if-no-files-found: warn
