name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fonts for store graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - run: npm install

      - name: Validate and package Chrome Web Store release
        run: make release

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-submission
          path: release/*.zip
          if-no-files-found: error
