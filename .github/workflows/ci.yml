name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fonts for store graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - run: npm install

      - run: npm run check

      - name: Package Chrome Web Store upload
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist
          zip -r "../hanyu-pinyin-reader-${VERSION}-chrome-web-store.zip" .
          cd ..

      - name: Package Chrome Web Store listing assets
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd chrome-store
          zip -r "../hanyu-pinyin-reader-${VERSION}-store-assets.zip" .
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-submission
          path: |
            hanyu-pinyin-reader-*-chrome-web-store.zip
            hanyu-pinyin-reader-*-store-assets.zip
          if-no-files-found: error
