<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanyu Pinyin Reader</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><img src="assets/icons/icon48.png" width="40" height="40" alt=""><div><h1>Hanyu Pinyin</h1><p id="site">Reading current page</p></div></header>
<p id="status" class="status" role="status" aria-live="polite">Loading settings</p>
<fieldset id="controls" disabled><legend class="sr-only">Reading controls</legend>
<label class="enable">Enable on this website<input id="enabled" type="checkbox"></label>
<label>Placement<select id="annotationMode"><option value="above">Above Chinese</option><option value="hover">On hover or link focus</option><option value="after">After Chinese</option><option value="hidden">Hidden - restore page</option></select></label>
<label>Annotation unit<select id="granularity"><option value="word">Words and phrases</option><option value="character">Characters</option></select></label>
<label>Tones<select id="toneStyle"><option value="marks">Tone marks - nǐ hǎo</option><option value="numbers">Tone numbers - ni3 hao3</option><option value="none">Without tones - ni hao</option></select></label>
<label>Website rule<select id="domainRule"><option value="inherit">Use global default</option><option value="always">Always enable</option><option value="never">Never enable</option></select></label>
<details><summary>Appearance</summary>
<label>Pinyin size <output id="fontScaleValue"></output><input id="fontScale" type="range" min="0.35" max="1" step="0.05"></label>
<label>Opacity <output id="opacityValue"></output><input id="opacity" type="range" min="0.2" max="1" step="0.05"></label>
<label>Spacing <output id="spacingValue"></output><input id="spacing" type="range" min="0" max="0.3" step="0.01"></label>
<label>Color<input id="color" type="color"></label>
<button id="defaults" type="button" class="secondary">Reset appearance</button></details>
<div class="actions"><button id="rescan" type="button">Rescan page</button><button id="clearCache" type="button" class="secondary">Clear cache</button></div>
</fieldset>
<footer><button id="options" type="button" class="link">Advanced settings</button><span>Local conversion</span></footer>
</main><script src="popup.js"></script></body></html>
